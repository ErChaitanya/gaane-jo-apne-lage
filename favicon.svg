  <!-- Sun -->
  <circle cx="50" cy="32" r="18" fill="#d4a574"/>
  <circle cx="50" cy="32" r="13" fill="#e8c89e"/>
  <!-- Chai cup -->
  <path d="M34 62 L34 82 Q34 90 42 90 L58 90 Q66 90 66 82 L66 62 Z" fill="#5c3d2e" rx="4"/>
  <path d="M66 68 Q76 68 76 76 Q76 84 66 82" fill="none" stroke="#5c3d2e" stroke-width="3.5"/>
