<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sun rays -->
  <g stroke="#d4a574" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <line x1="50" y1="8" x2="50" y2="2"/>
    <line x1="68" y1="14" x2="72" y2="9"/>
    <line x1="78" y1="30" x2="84" y2="27"/>
    <line x1="22" y1="14" x2="18" y2="9"/>
    <line x1="12" y1="30" x2="6" y2="27"/>
